name: Continuous Deployment to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-to-ec2:
    name: Deploy Microservices to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands & Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Continuous Deployment for THE-MovieBox on AWS EC2..."

            # Step 0: Ensure K3s Kubernetes Engine is installed and active
            if ! command -v k3s &> /dev/null; then
              echo "📦 K3s not found. Installing lightweight Kubernetes engine with Docker integration..."
              curl -sfL https://get.k3s.io | sh -s - --docker
              sleep 10
            fi

            # Wait for K3s Control Plane readiness
            echo "⏳ Waiting for K3s cluster control plane to respond..."
            until sudo k3s kubectl get nodes &> /dev/null; do
              echo "Waiting for K3s API server..."
              sleep 3
            done

            # Step 1: Ensure workspace repository directory exists
            if [ ! -d "$HOME/THE-MovieBox" ]; then
              echo "📥 Repository not found. Cloning repository into $HOME/THE-MovieBox..."
              git clone https://github.com/Hasnain-rdj/THE-MovieBox.git "$HOME/THE-MovieBox"
            fi

            cd "$HOME/THE-MovieBox"

            # Step 2: Fetch and pull latest code from main branch
            echo "🔄 Fetching latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Step 3: Securely generate k8s/secrets.local.yml on the EC2 server (NOT tracked in git)
            echo "🔒 Ensuring k8s/secrets.local.yml exists locally on EC2 host..."
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: Secret' \
              'metadata:' \
              '  name: moviebox-secrets' \
              '  labels:' \
              '    app.kubernetes.io/name: moviebox-secrets' \
              '    app.kubernetes.io/part-of: the-moviebox' \
              'type: Opaque' \
              'stringData:' \
              '  MONGO_URI: "mongodb+srv://hasnain:1685@cluster0.arb20r6.mongodb.net/?appName=Cluster0"' \
              '  JWT_SECRET: "9d097df9bb52b437e025bae9b17320dc72792f156db74866ea4ac7b3d7bc24ea"' \
              '  TMDB_API_KEY: "e0c2c693d80345a911fac92dbf1b27dd"' \
              '  OMDB_API_KEY: "f4dc3b7f"' > k8s/secrets.local.yml

            # Step 4: Aggressively reclaim disk space & rebuild Docker images for all microservices
            echo "🧹 Aggressively reclaiming disk space on EC2 host..."
            sudo docker system prune -af --volumes || true
            sudo k3s crictl rmi --prune || true
            sudo rm -rf /tmp/* /var/tmp/* || true

            echo "🐳 Building Docker images for auth-service, movie-service, and frontend..."
            sudo docker build -t the-moviebox-auth:latest ./auth-service
            sudo docker build -t the-moviebox-movie:latest ./movie-service
            sudo docker build -t the-moviebox-frontend:latest ./frontend

            # Import images to K3s containerd only if K3s is not using Docker daemon directly
            if ! sudo k3s kubectl get nodes -o wide 2>/dev/null | grep -i "docker" &> /dev/null; then
              echo "📦 Importing Docker images into K3s containerd storage..."
              sudo docker save the-moviebox-auth:latest the-moviebox-movie:latest the-moviebox-frontend:latest | sudo k3s ctr images import -
            fi

            # Step 5: Apply Kubernetes manifests using sudo k3s kubectl
            echo "☸️ Applying Kubernetes manifests..."
            sudo k3s kubectl apply -f k8s/secrets.local.yml \
                                  -f k8s/auth-deployment.yml \
                                  -f k8s/movie-deployment.yml \
                                  -f k8s/frontend-deployment.yml \
                                  -f k8s/monitoring/prometheus-config.yml \
                                  -f k8s/monitoring/prometheus-deployment.yml \
                                  -f k8s/monitoring/grafana-deployment.yml

            # Step 6: Force zero-downtime restart of all deployments
            echo "⚡ Triggering zero-downtime rollout restart..."
            sudo k3s kubectl rollout restart deployment auth-deployment \
                                                       movie-deployment \
                                                       frontend-deployment \
                                                       prometheus-deployment \
                                                       grafana-deployment

            # Step 7: Verify rollout status
            echo "🔍 Verifying rollout status for all deployments..."
            sudo k3s kubectl rollout status deployment auth-deployment --timeout=120s
            sudo k3s kubectl rollout status deployment movie-deployment --timeout=120s
            sudo k3s kubectl rollout status deployment frontend-deployment --timeout=120s

            echo "✅ Continuous Deployment Completed Successfully!"
